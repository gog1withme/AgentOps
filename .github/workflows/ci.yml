name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build dashboard
        working-directory: dashboard
        run: npm ci || npm install && npm run build
      - name: Build
        run: go build -ldflags "-X github.com/gog1withme/AgentOps/cli/version.Version=dev" -o bin/agentops ./cli
      - name: Test
        run: go test ./...

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: dashboard
        run: npm ci || npm install
      - name: Lint
        working-directory: dashboard
        run: npm run lint
      - name: Build
        working-directory: dashboard
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci || npm install
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Install Playwright
        working-directory: dashboard
        run: npx playwright install chromium
      - name: E2E tests
        working-directory: dashboard
        run: npm run test:e2e
